<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Global Flight Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading">INITIALIZING GRID…</div>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import * as topojson from 'topojson-client';

  // ---------- CONFIG ----------
  const MOBILE = Math.min(innerWidth, innerHeight) < 768;
  const R = 100;
  const DOT_COUNT = MOBILE ? 22000 : 40000;
  const LAND_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';

  function latLonToVec3(lat, lon, r = R) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ---------- SCENE ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
  camera.position.set(0, 60, MOBILE ? 420 : 320);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 160;
  controls.maxDistance = 700;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  const globe = new THREE.Group();
  scene.add(globe);

  // ---------- GLOBE ----------
  // Dark core sphere hides the dots on the far side.
  globe.add(new THREE.Mesh(
    new THREE.SphereGeometry(R, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x030c1c })
  ));

  function dotTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.4, 'rgba(255,255,255,0.8)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  function buildLandMask(topo) {
    const W = 1024, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    const land = topojson.feature(topo, topo.objects.land);
    const project = ([lon, lat]) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
    // Unwrap longitudes so rings crossing the antimeridian stay continuous;
    // a ring that wraps the whole globe (Antarctica) is closed through the pole.
    const unwrap = ring => {
      const out = [ring[0].slice()];
      for (let i = 1; i < ring.length; i++) {
        let lon = ring[i][0];
        const prev = out[i - 1][0];
        while (lon - prev > 180) lon -= 360;
        while (lon - prev < -180) lon += 360;
        out.push([lon, ring[i][1]]);
      }
      const first = out[0], last = out[out.length - 1];
      if (Math.abs(last[0] - first[0]) > 180) out.push([last[0], -90], [first[0], -90]);
      return out;
    };
    for (const f of land.features) {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      for (const poly of polys) {
        const rings = poly.map(unwrap);
        for (const shift of [-360, 0, 360]) {
          g.beginPath();
          for (const ring of rings) {
            ring.forEach(([lon, lat], i) => {
              const [x, y] = project([lon + shift, lat]);
              i ? g.lineTo(x, y) : g.moveTo(x, y);
            });
            g.closePath();
          }
          g.fill('evenodd');
        }
      }
    }
    const data = g.getImageData(0, 0, W, H).data;
    return (lat, lon) => {
      const x = Math.min(W - 1, Math.floor((lon + 180) / 360 * W));
      const y = Math.min(H - 1, Math.floor((90 - lat) / 180 * H));
      return data[(y * W + x) * 4] > 128;
    };
  }

  function buildLandDots(isLand) {
    const positions = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < DOT_COUNT; i++) {
      const y = 1 - 2 * (i + 0.5) / DOT_COUNT;
      const lat = Math.asin(y) * 180 / Math.PI;
      let lon = ((i * golden) * 180 / Math.PI) % 360 - 180;
      if (!isLand(lat, lon)) continue;
      const v = latLonToVec3(lat, lon, R + 0.4);
      positions.push(v.x, v.y, v.z);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
      size: MOBILE ? 1.6 : 1.3,
      map: dotTexture(),
      color: 0x3ff2ff,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    }));
  }

  function buildWireframe() {
    return new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.3, 36, 18),
      new THREE.MeshBasicMaterial({ color: 0x3ff2ff, wireframe: true, transparent: true, opacity: 0.25 })
    );
  }

  fetch(LAND_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(topo => globe.add(buildLandDots(buildLandMask(topo))))
    .catch(err => { console.warn('Land data unavailable, using wireframe:', err); globe.add(buildWireframe()); })
    .finally(() => document.getElementById('loading').classList.add('done'));

  // ---------- LOOP ----------
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
  </script>
</body>
</html>
